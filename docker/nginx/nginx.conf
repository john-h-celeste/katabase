worker_processes auto;
events { worker_connections 1024; }

http {
    # rate limit requests to 10 per ip per minute
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/m;
    limit_req_status 429;

    upstream web_pool {
        server web1:8000 max_fails=2 fail_timeout=10s;
        server web2:8000 max_fails=2 fail_timeout=10s;
        server web3:8000 max_fails=2 fail_timeout=10s;
    }

    upstream inference_pool {
        least_conn;
        server inference1:11434 max_fails=2 fail_timeout=15s;
        server inference2:11434 max_fails=2 fail_timeout=15s;
    }

    # public point
    server {
        listen 80;

        # which container handled the request
        add_header X-Upstream $upstream_addr always;

        location / {
            proxy_pass http://web_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # rate limited
        location /api/ask {
            limit_req zone=ai_limit burst=5 nodelay;

            proxy_pass http://web_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }

    # this is the load balancer (private)
    server {
        listen 11434;

        location / {
            proxy_pass http://inference_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}