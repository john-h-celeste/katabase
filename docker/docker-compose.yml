name: ai-rag

x-web: &web
  build: ../app
  restart: unless-stopped
  environment:
    DB_HOST: db
    POSTGRES_DB: ragdb
    POSTGRES_USER: raguser
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    OLLAMA_URL: http://inference-lb:11434
  networks: [backend]
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 20s
  deploy:
    resources:
      limits: { cpus: "0.5", memory: 512M }

x-inference: &inference
  image: ollama/ollama:0.40.17
  restart: unless-stopped
  environment:
    OLLAMA_MODELS: /models
    OLLAMA_KEEP_ALIVE: 24h # keep the model loaded between requests
  volumes:
    - /models:/models
  networks: [backend]
  healthcheck:
    test: ["CMD-SHELL", "ollama list | grep -q llama3.2"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s
  deploy:
    resources:
      limits: { cpus: "1.5", memory: 4G }

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80" # publish port
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ha-rag/nginx:/etc/nginx/dynamic:ro
    networks:
      frontend: {}
      backend:
        aliases: [inference-lb]
    depends_on: [web1, web2, web3, inference1, inference2]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  web1: { <<: *web, container_name: web1 }
  web2: { <<: *web, container_name: web2 }
  web3: { <<: *web, container_name: web3 }

  # for the scalibility portion (these aren't restarted by a reboot)
  web4: { <<: *web, container_name: web4, profiles: ["scale"], restart: "no" }

  inference1: { <<: *inference, container_name: inference1 }
  inference2: { <<: *inference, container_name: inference2 }

  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ragdb
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /data/db:/var/lib/postgresql/data
      - ../scripts/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 2G }

  ingest:
    build:
      context: ..
      dockerfile: scripts/Dockerfile.ingest
    profiles: ["tools"]
    environment:
      DB_HOST: db
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OLLAMA_URL: http://inference-lb:11434
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

networks:
  frontend: {}
  backend:
    internal: true