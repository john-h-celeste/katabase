services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ragdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /data/db:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

networks:
  backend:
    internal: true