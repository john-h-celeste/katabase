<!DOCTYPE html>
<body>
	<title>AI Infrastructure Project</title>
	<header align="center">Ask the AI a question!</header>
	</br>
	<div align="center"id="ask">
		<input align="left" type="text" placeholder="Enter your question here...">
		<button align="right">Ask</button>
	</div>

	<p id="response"></p>

	<script>
		const askButton = document.querySelector("button");
		const inputField = document.querySelector("input");
		const responseDiv = document.getElementById("response");

		inputField.addEventListener("keypress", (event) => {
			if (event.key === "Enter") {
				askButton.click();
			}
		});

		askButton.addEventListener("click", async () => {
			const question = inputField.value;
			if (!question) return;

			responseDiv.textContent = "Thinking...";

			try {
				const response = await fetch("/api/ask", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({ question }),
				});

				if (!response.ok) {
					throw new Error(`HTTP error! \nstatus: ${response.status}\nmessage: ${await response.text()}`);
				}

				const data = await response.json();
				responseDiv.textContent = data.answer ?? "No answer received.";
			} catch (error) {
				responseDiv.textContent = `Error: ${error.message}`;
			}
		});
	</script>
</body>
